version: 2
updates:
  - package-ecosystem: "pip"
  # Location of pyproject.toml
    directory: "/"
    schedule:
      interval: "daily"
    # Update all dependencies in one PR
    groups:
      python-requirements:
        patterns:
          - "*"
    # Dependabot's default commit messages ("Bump urllib3 from 2.7.0 to
    # 2.8.0") are not conventional commits, so prefix them to satisfy the
    # conventional-commit check. The prefix does not add these commits to the
    # changelog: commitizen's default change_type_map only covers feat, fix,
    # refactor, and perf.
    commit-message:
      prefix: "build"
      prefix-development: "build"
